services:
  - type: web
    name: buscador-imagenes-multimodal
    runtime: python
    plan: 2c-4g
    buildCommand: pip install -r requirements.txt && python -m gemma.scripts.prepare_render
    startCommand: uvicorn gemma.codigos.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENCLIP_IMAGE_COUNT
        value: "5000"
      - key: GEMMA_IMAGE_COUNT
        value: "5000"
